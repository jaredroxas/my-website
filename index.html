<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Login - Jared Roxas</title>
    <style>
        body {
            background-color: #1a1a2e;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        form {
            background: #0f0f23;
            padding: 40px;
            border-radius: 12px;
            border: 2px solid #444;
            text-align: center;
        }
        input {
            display: block;
            margin: 15px auto;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            width: 200px;
        }
        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
    <script>
        function check(form) {
            if(form.userid.value == "student" && form.pswrd.value == "password123") {
                window.open("index.html", "_self");
            }
            else {
                alert("Error Password or Username");
            }
        }
    </script>
</head>
<body>
    <form name="login">
        <h2>Portfolio Login</h2>
        <p>User: student / Pass: password123</p>
        <input type="text" name="userid" placeholder="Username" required/>
        <input type="password" name="pswrd" placeholder="Password" required/>
        <button type="button" onclick="check(this.form)">Login</button>
    </form>
</body>
</html>
